server:
  port: 8086

spring:
  application:
    name: ai-customer-service
  datasource:
    url: jdbc:h2:mem:aicustomerservicedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-override-318-capstone-shared-hs256-secret-32bytes-min}
    # Shared HS256 secret - MUST be identical across all six services (see
    # 1-technical-architecture-v2.md Security Model). The default here is a
    # dev-only placeholder; override via the JWT_SECRET env var for anything
    # beyond local dev.
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082/api/v1}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083/api/v1}
  openai:
    api-key: ${OPENAI_API_KEY:sk-43afc28ee79c4ae8849109dd5d3c7781}
    # No default on purpose - a real key is a secret and should never be committed to git.
    # Set it as an environment variable (OPENAI_API_KEY) wherever this service actually runs
    # (IntelliJ Run Configuration -> Environment variables, or the shell before launching it).
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
    model-name: ${OPENAI_MODEL:deepseek-flash}
    # Defaulted to DeepSeek's OpenAI-compatible endpoint/model since that's what this project
    # actually uses. To point at real OpenAI instead, override via env vars:
    # OPENAI_BASE_URL=https://api.openai.com/v1, OPENAI_MODEL=gpt-4o-mini (or another OpenAI model).
