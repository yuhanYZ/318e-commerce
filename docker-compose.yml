# Local Kafka broker for this project's five services (user/product/order/
# inventory/payment-service). Every service's application.yml already points
# at spring.kafka.bootstrap-servers: localhost:9092, so nothing in the Java
# code needs to change - this just makes something real listen on that port.
#
# Single-node KRaft mode (no ZooKeeper needed) using Confluent's images, which
# is the most widely documented setup for exactly this scenario. Two listeners
# are configured on the "kafka" service:
#   - PLAINTEXT_HOST (localhost:9092) - for the five Spring Boot services,
#     which run directly on your machine (IntelliJ), NOT inside Docker.
#   - PLAINTEXT (kafka:29092) - for other containers on the same Docker
#     network (kafka-ui below) to reach the broker by its container name.
#
# Usage (run from this project's root, where this file lives):
#   docker compose up -d        # start Kafka + kafka-ui in the background
#   docker compose ps           # check both are healthy
#   docker compose logs -f kafka  # watch broker logs
#   docker compose down         # stop everything (topics survive in the named volume below;
#                               # add -v to wipe them as well)
#
# Requires Docker Desktop installed and running. After `docker compose up -d`,
# start the five services with the "kafka" Spring profile active (e.g. IntelliJ
# Run Configuration -> Active profiles: kafka, or
# --spring.profiles.active=kafka / SPRING_PROFILES_ACTIVE=kafka) - this is
# what actually turns on their Kafka producer/consumer beans and sets
# app.kafka.enabled=true (see each service's application.yml "kafka"-profile
# document). Without that profile, the services run exactly as they do under
# `mvn test`: zero Kafka activity, by design.
#
# kafka-ui (http://localhost:8090 once started) lets you watch topics/messages
# live - e.g. place an order via order-service's POST /orders and watch the
# "order.created" topic receive a message, which is the easiest way to prove
# the O1 -> I2 event flow is actually wired up end-to-end for your demo/report.
# (Producers use Spring Cloud Stream's StreamBridge; consumers are
# java.util.function.Consumer<T> @Bean methods in each service's
# config.KafkaConsumerConfig - see 6-cqrs-command-query.md §8 for the full
# topic/payload catalog.)

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: 318-kafka
    ports:
      - "9092:9092"
    volumes:
      # Named volume so topics, offsets and (therefore) the Kafka Streams changelog topics
      # survive `docker compose down` and container recreation. Without it, every container
      # recreation wipes the broker while the services still hold local RocksDB state
      # directories from the previous broker generation, and both stream-processing
      # topologies (O6 analytics, I4 alerts) then fail to start - see the README gotchas.
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: 318-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  # Broker state (topics, offsets, Kafka Streams changelog topics). Keeping it across
  # `docker compose down` avoids forcing both stream topologies to rebuild from scratch;
  # `docker compose down -v` deliberately wipes it.
  kafka-data:
