server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentservicedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      # Payment Service is a pure Kafka PRODUCER (payment.confirmed/payment.failed/payment.refunded)
      # for this iteration - no spring.cloud.function.definition/bindings needed here, since there
      # are no consumer beans. Publishing goes through StreamBridge (PaymentCommandService), gated
      # by app.kafka.enabled below - see order-service/application.yml's identical comment for the
      # full rationale.

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-override-318-capstone-shared-hs256-secret-32bytes-min}
    # Shared HS256 secret - MUST be identical across all six services (see
    # 1-technical-architecture-v2.md Security Model). The default here is a
    # dev-only placeholder; override via the JWT_SECRET env var for anything
    # beyond local dev.
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083/api/v1}
  payment:
    mock-failure-fraction: "99"   # amount fraction that deterministically fails, see 3-domain-models-payment-service-ddd.md §2.3.1
  kafka:
    enabled: false
    # Default OFF - no contract test activates the "kafka" profile, so publishPaymentOutcome/
    # publishRefundProcessed (PaymentCommandService) are guaranteed no-ops during mvn test.

---
spring:
  config:
    activate:
      on-profile: kafka

app:
  kafka:
    enabled: true
