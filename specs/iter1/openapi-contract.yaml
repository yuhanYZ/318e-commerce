# ARCHIVED — Iteration 1 (superseded by specs/iter2/openapi-contract-v2.yaml).
# Kept for historical reference only; do not use as the current design of record.
openapi: 3.0.3
info:
  title: E-Commerce Microservices API Specification
  description: OpenAPI 3.0 specification for the 318e-e-commerce microservice application — User, Product, Order, Inventory, Payment, and AI-Customer services, based on user stories.
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
    description: User Service Local Development Server
  - url: http://localhost:8082/api/v1
    description: Product Service Local Development Server
  - url: http://localhost:8083/api/v1
    description: Order Service Local Development Server
  - url: http://localhost:8084/api/v1
    description: Inventory Service Local Development Server
  - url: http://localhost:8085/api/v1
    description: Payment Service Local Development Server
  - url: http://localhost:8086/api/v1
    description: AI-Customer Service Local Development Server

tags:
  - name: User Service
    description: Account registration, authentication, and profile management endpoints
  - name: Product Service
    description: Product catalog browsing, search, and management endpoints
  - name: Order Service
    description: Order placement, status tracking, and cancellation endpoints
  - name: Inventory Service
    description: Stock availability, adjustment, and low-stock alert endpoints
  - name: Payment Service
    description: Payment processing and refund endpoints
  - name: AI-Customer Service
    description: Agentic AI chat, escalation, and conversation log endpoints

paths:
  # ==========================================
  # USER SERVICE ENDPOINTS
  # ==========================================
  /users/register:
    post:
      tags:
        - User Service
      summary: Register a new customer account (Feature U1)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/login:
    post:
      tags:
        - User Service
      summary: Authenticate and issue a JWT token (Feature U2)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account locked after 5 failed attempts within 10 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - User Service
      summary: Get the current user's profile (Feature U3)
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - User Service
      summary: Update name, address, or phone (Feature U3)
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - User Service
      summary: Deactivate account (soft delete) (Feature U5)
      operationId: deactivateMyAccount
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deactivated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/password-reset/request:
    post:
      tags:
        - User Service
      summary: Request a password reset token by email (Feature U4)
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset token generated and sent (always returned to avoid email enumeration)

  /users/password-reset/confirm:
    post:
      tags:
        - User Service
      summary: Submit token and new password (Feature U4)
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # PRODUCT SERVICE ENDPOINTS
  # ==========================================
  /products:
    get:
      tags:
        - Product Service
      summary: Browse products by category, paginated (Feature P1)
      operationId: browseProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of active products in the category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'

    post:
      tags:
        - Product Service
      summary: Create a new product (Feature P4, Admin only)
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/{id}:
    get:
      tags:
        - Product Service
      summary: Get product details, incl. live stock status (Feature P2)
      description: |
        Includes an inter-service validation call to Inventory Service
        (GET /inventory/{productId}) to retrieve current stock quantity.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Product Service
      summary: Update a product (Feature P4, Admin only)
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/deactivate:
    patch:
      tags:
        - Product Service
      summary: Deactivate a product (Feature P4, Admin only)
      operationId: deactivateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/search:
    get:
      tags:
        - Product Service
      summary: Search products by name/description keyword (Feature P3)
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Products matching the keyword, ranked by relevance (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'

  # ==========================================
  # ORDER SERVICE ENDPOINTS
  # ==========================================
  /orders:
    post:
      tags:
        - Order Service
      summary: Place a new order (Feature O1)
      description: |
        Includes an inter-service validation call to Inventory Service
        (GET /inventory/{productId}) for each item to confirm sufficient stock
        before creating the order and publishing OrderCreatedEvent to Kafka.
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully with status PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Insufficient stock for one or more items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Order Service
      summary: List the current user's order history, paginated (Feature O3)
      operationId: listMyOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated order history, newest first (empty array if none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageResponse'

  /orders/{id}:
    get:
      tags:
        - Order Service
      summary: Get the current status of an order (Feature O2)
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/cancel:
    post:
      tags:
        - Order Service
      summary: Cancel an order before it ships (Feature O4)
      description: |
        Publishes OrderCancelledEvent to Kafka on success. Inventory Service and
        Payment Service consume this event to release stock and process refunds respectively.
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order already SHIPPED or CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # INVENTORY SERVICE ENDPOINTS
  # ==========================================
  /inventory/{productId}:
    get:
      tags:
        - Inventory Service
      summary: Check stock availability for a product (Feature I1)
      operationId: getStockByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current stock level retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/{productId}/adjust:
    post:
      tags:
        - Inventory Service
      summary: Manually adjust stock / restock (Feature I3, Admin only)
      operationId: adjustStock
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Stock adjusted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '400':
          description: Adjustment would result in negative stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inventory/alerts:
    get:
      tags:
        - Inventory Service
      summary: List active low-stock alerts (Feature I4, Admin only)
      operationId: listLowStockAlerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active low-stock alerts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockAlertResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # PAYMENT SERVICE ENDPOINTS
  # ==========================================
  /payments:
    post:
      tags:
        - Payment Service
      summary: Pay for a pending order (Feature PAY1)
      description: |
        Includes an inter-service validation call to Order Service
        (GET /orders/{id}) to confirm the order exists and is not already paid.
      operationId: payForOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment processed; PaymentConfirmedEvent or PaymentFailedEvent published to Kafka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          description: Order not found or already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Payment Service
      summary: List all payment/refund transactions, paginated (Feature PAY4, Admin only)
      operationId: listAllPayments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction records retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /payments/order/{orderId}:
    get:
      tags:
        - Payment Service
      summary: Get the payment status for an order (Feature PAY2)
      operationId: getPaymentByOrderId
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{id}/refund:
    post:
      tags:
        - Payment Service
      summary: Request a refund for a paid order (Feature PAY3)
      description: |
        Includes an inter-service validation call to Order Service
        (GET /orders/{orderId}) to confirm the order is eligible for refund
        (e.g. linked to a CANCELLED/RETURNED order).
      operationId: requestRefund
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Refund processed; RefundProcessedEvent published to Kafka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '409':
          description: Order does not meet refund eligibility criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # AI-CUSTOMER SERVICE ENDPOINTS
  # ==========================================
  /ai-chat/sessions/{sessionId}/messages:
    post:
      tags:
        - AI-Customer Service
      summary: Ask a product/order question or return/exchange question (Features AI1, AI2)
      description: |
        The agent (via LangChain4j tool calling) may issue REST requests to
        Product Service and/or Order Service to retrieve grounded data before
        the LLM (GPT-4o-mini) composes its reply.
      operationId: sendChatMessage
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: AI response generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - AI-Customer Service
      summary: Get full message history for a session (Feature AI4, Admin only)
      operationId: getSessionMessages
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ai-chat/sessions/{sessionId}/escalate:
    post:
      tags:
        - AI-Customer Service
      summary: Escalate the session to a human agent (Feature AI3)
      operationId: escalateSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session escalated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /ai-chat/sessions:
    get:
      tags:
        - AI-Customer Service
      summary: List conversation sessions, paginated (Feature AI4, Admin only)
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- User Service ----------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: "customer@example.com"
        password:
          type: string
          format: password
          example: "P@ssw0rd123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: "customer@example.com"
        password:
          type: string
          format: password
          example: "P@ssw0rd123"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        userId:
          type: string
          example: "USR-1001"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: "USR-1001"
        email:
          type: string
          example: "customer@example.com"
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
          example: "CUSTOMER"

    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          example: "USR-1001"
        email:
          type: string
          example: "customer@example.com"
        name:
          type: string
          example: "Jane Doe"
        address:
          type: string
          example: "12 King St, Wollongong NSW"
        phone:
          type: string
          example: "+61 400 000 000"
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, LOCKED, DEACTIVATED]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: "customer@example.com"

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password

    # ---------- Product Service ----------
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          example: "PRD-2001"
        name:
          type: string
          example: "Wireless Mouse"
        description:
          type: string
          example: "2.4GHz wireless mouse with USB receiver"
        price:
          type: number
          format: double
          example: 29.99
        imageUrl:
          type: string
          example: "https://cdn.example.com/products/2001.jpg"
        categoryId:
          type: string
          example: "CAT-10"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    ProductDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ProductResponse'
        - type: object
          properties:
            stockAvailable:
              type: integer
              example: 42
            isInStock:
              type: boolean
              example: true

    ProductPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          example: 0
        totalElements:
          type: integer
          example: 87

    ProductCreateRequest:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imageUrl:
          type: string
        categoryId:
          type: string

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imageUrl:
          type: string

    # ---------- Order Service ----------
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                example: "PRD-2001"
              quantity:
                type: integer
                example: 2

    OrderItemResponse:
      type: object
      properties:
        productId:
          type: string
          example: "PRD-2001"
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 29.99

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          example: "ORD-5001"
        userId:
          type: string
          example: "USR-1001"
        status:
          type: string
          enum: [PENDING, PAID, PAYMENT_FAILED, SHIPPED, CANCELLED]
        totalAmount:
          type: number
          format: double
          example: 59.98
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-09T10:00:00Z"

    OrderPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
          example: 0
        totalElements:
          type: integer
          example: 14

    # ---------- Inventory Service ----------
    StockResponse:
      type: object
      properties:
        productId:
          type: string
          example: "PRD-2001"
        quantityAvailable:
          type: integer
          example: 42
        isAvailable:
          type: boolean
          example: true

    StockAdjustmentRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Positive to restock, negative to deduct
          example: 50
        reason:
          type: string
          example: "Supplier restock"

    LowStockAlertResponse:
      type: object
      properties:
        id:
          type: string
          example: "ALERT-301"
        stockItemId:
          type: string
          example: "STK-2001"
        triggeredAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    # ---------- Payment Service ----------
    PaymentRequest:
      type: object
      required: [orderId, amount, method]
      properties:
        orderId:
          type: string
          example: "ORD-5001"
        amount:
          type: number
          format: double
          example: 59.98
        method:
          type: string
          example: "MOCK_CARD"

    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          example: "PAY-7001"
        orderId:
          type: string
          example: "ORD-5001"
        amount:
          type: number
          format: double
          example: 59.98
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
        method:
          type: string
          example: "MOCK_CARD"
        createdAt:
          type: string
          format: date-time

    PaymentPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'
        page:
          type: integer
          example: 0
        totalElements:
          type: integer
          example: 200

    RefundRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          example: 59.98

    RefundResponse:
      type: object
      properties:
        id:
          type: string
          example: "REF-9001"
        paymentId:
          type: string
          example: "PAY-7001"
        amount:
          type: number
          format: double
          example: 59.98
        status:
          type: string
          enum: [REQUESTED, PROCESSED, REJECTED]
        requestedAt:
          type: string
          format: date-time

    # ---------- AI-Customer Service ----------
    ChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "Where is my order ORD-5001?"

    ChatMessageResponse:
      type: object
      properties:
        id:
          type: string
          example: "MSG-8001"
        sessionId:
          type: string
          example: "SESS-4001"
        sender:
          type: string
          enum: [USER, AI, AGENT]
        content:
          type: string
          example: "Your order ORD-5001 is currently SHIPPED and should arrive within 2 business days."
        createdAt:
          type: string
          format: date-time

    ConversationSessionResponse:
      type: object
      properties:
        id:
          type: string
          example: "SESS-4001"
        userId:
          type: string
          example: "USR-1001"
        status:
          type: string
          enum: [ACTIVE, ESCALATED, CLOSED]
        createdAt:
          type: string
          format: date-time

    # ---------- Shared ----------
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Order not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-09T19:15:00Z"

  responses:
    BadRequest:
      description: Invalid request parameters or body payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller does not have the required Admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
