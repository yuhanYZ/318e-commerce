server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userservice;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# app.jwt.secret below is a placeholder Base64-encoded 384-bit key generated for local
# development ONLY. Replace it (e.g. via an environment variable) before any real deployment.
app:
  jwt:
    secret: "kQbfTYJzlIoUnLQQ7pah1+LRq3mUgOznZW7FQdpUwvbRh2BI1cIpDIAY9k5gn8TK"
    expiration-ms: 86400000 # 24 hours
  security:
    max-failed-attempts: 5        # U2: consecutive failures before lockout
    failure-window-minutes: 10    # U2: the "within 10 minutes" window
    lockout-duration-minutes: 15  # how long a LOCKED account stays locked before auto-unlocking
    reset-token-expiry-minutes: 30 # U4: password reset token lifetime
  admin:
    # Seeded on startup by AdminAccountInitializer if no account with this email
    # exists yet - there is otherwise no way to create an ADMIN account (U1's
    # RegisterRequest has no role field, by design). Local development
    # credentials only, same as app.jwt.secret above - override both via
    # environment variables before any real deployment.
    default-email: "admin@318ecommerce.local"
    default-password: "Admin@12345"

logging:
  level:
    com.ecommerce.userservice: INFO
