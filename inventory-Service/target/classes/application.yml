server:
  port: 8084

spring:
  application:
    name: inventory-Service
  datasource:
    url: jdbc:h2:mem:inventoryservicedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      # spring.cloud.function.definition / spring.cloud.stream.bindings live in the "kafka"-profile
      # document below (6-cqrs-command-query.md §8) so mvn test never activates real bindings.

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-override-318-capstone-shared-hs256-secret-32bytes-min}
    # Shared HS256 secret - MUST be identical across all six services (see
    # 1-technical-architecture-v2.md Security Model). The default here is a
    # dev-only placeholder; override via the JWT_SECRET env var for anything
    # beyond local dev.
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  kafka:
    enabled: false
    # Default OFF - see order-service/application.yml's identical comment for the full rationale.
    # I2/I5's Consumer beans (config.KafkaConsumerConfig) are @Profile("kafka") too, so mvn test
    # never sees them regardless.

---
spring:
  config:
    activate:
      on-profile: kafka
  cloud:
    function:
      definition: deductStockOnOrderCreated;releaseStockOnOrderCancelled;releaseStockOnPaymentFailed;lowStockAlertTopology
      kafka:
        streams:
          binder:
            # I4's alert projection is a Kafka Streams application, so it needs its own
            # application id (which also names its state store / changelog topics).
            application-id: inventory-alerts
            configuration:
              default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
              default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
              spring.json.trusted.packages: com.ecommerce.inventoryservice.*
    stream:
      bindings:
        deductStockOnOrderCreated-in-0:
          destination: order.created
          group: inventory-service
        releaseStockOnOrderCancelled-in-0:
          destination: order.cancelled
          group: inventory-service
        releaseStockOnPaymentFailed-in-0:
          destination: payment.failed
          group: inventory-service
        # I4 — consumes Inventory's own republished stock events (no new integration topic for the
        # output: the topology sinks straight into the low_stock_alert store).
        lowStockAlertTopology-in-0:
          destination: stock.changed
          group: inventory-service-alerts
          binder: kafka-streams

app:
  kafka:
    enabled: true
